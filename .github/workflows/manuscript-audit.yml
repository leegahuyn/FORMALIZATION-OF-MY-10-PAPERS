name: Manuscript audit baseline
on:
  push:
    branches: [codex/overleaf-bundle-formalization]
    paths:
      - '.github/workflows/manuscript-audit.yml'
      - 'PrimalitySheafVerification/*.lean'
      - 'PrimalitySheafVerification/ManuscriptAudit/AxiomAudit.lean'
      - 'Mathlib/**'
      - 'Mathlib.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
permissions:
  contents: read
concurrency:
  group: manuscript-audit-cached-${{ github.ref }}
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up pinned Lean and Mathlib cache
        id: setup
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          lint: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Restore vendored build objects
        id: baseline-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake
          key: manuscript-baseline-0e026509-linux-arm64-v1
          restore-keys: manuscript-lean-imports-0e026509-linux-arm64-
      - name: Build all primary modules and bridges
        id: aggregate
        shell: bash
        run: |
          set -euo pipefail
          logs="${RUNNER_TEMP}/manuscript-audit"
          mkdir -p "$logs"
          { git rev-parse HEAD; cat lean-toolchain; lean --version; lake --version; } > "$logs/provenance.log"
          status=0
          lake build PrimalitySheafVerification.BuildAll 2>&1 |
            tee "$logs/build-all.log" |
            awk 'NR % 100 == 0 || /PrimalitySheafVerification/ || /[Ee]rror/ {print; fflush()}' ||
            status=$?
          tail -n 20 "$logs/build-all.log"
          exit "$status"
      - name: Check focused verification file
        id: focused
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          logs="${RUNNER_TEMP}/manuscript-audit"
          mkdir -p "$logs"
          status=0
          lake build PrimalitySheafVerification.Verification > "$logs/verification.log" 2>&1 || status=$?
          cat "$logs/verification.log"
          exit "$status"
      - name: Save compiled original modules on GitHub
        if: ${{ !cancelled() && steps.aggregate.outcome == 'success' && steps.baseline-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake
          key: ${{ steps.baseline-cache.outputs.cache-primary-key }}
      - name: Audit transitive kernel dependencies
        if: ${{ !cancelled() && steps.aggregate.outcome == 'success' && steps.focused.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          logs="${RUNNER_TEMP}/manuscript-audit"
          status=0
          lake env lean PrimalitySheafVerification/ManuscriptAudit/AxiomAudit.lean > "$logs/axioms.tsv" 2>&1 || status=$?
          tail -n 25 "$logs/axioms.tsv"
          exit "$status"
      - name: Preserve logs on GitHub
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manuscript-audit-${{ github.sha }}
          path: ${{ runner.temp }}/manuscript-audit
          if-no-files-found: warn
          retention-days: 30
