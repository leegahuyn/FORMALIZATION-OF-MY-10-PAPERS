            echo "Checking $package_path/$proof.lean" | tee -a "$output"
            deps=()
            missing=0
            while IFS= read -r prerequisite; do
              if [[ ! -s "$records/$prerequisite.sha256" ||
                    ! -f "$compiled/$package_path/$prerequisite.olean" ]]; then
                echo "Missing checked import $prerequisite" | tee -a "$output"
