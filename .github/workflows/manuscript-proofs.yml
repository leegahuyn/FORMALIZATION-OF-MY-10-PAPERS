ubicTraceClassification CubicGeometricClassification Paper5PrintedSupersingular Paper5PrintedNonsplitTateTraces Paper5PrintedAllTateTraces Paper5PrintedAllTateDeterminants Paper5PrintedActualExtensionCounts Paper5FrobeniusModThree Paper5ActualHasseWeil CubicSupersingularHasseWeil CubicSupersingularCanonicalZeta CubicSupersingularAnalyticZeta Paper5FrobeniusModTwo Paper5TwoPowerFrobenius Paper5TwoAdicFrobenius Paper5TwoAdicCoefficients PowerTateCoefficientReduction CubicSplitTwoAdicForm CubicSplitTwoAdicUniqueForm CubicSplitThreeAdicForm Paper5NonsplitTwoAdicTrace Paper5NonsplitTwoAdicModFour Paper5NonsplitQuarticCount Paper5NonsplitModEight Paper5CharacteristicFiveTate Paper5CharacteristicFiveTateCharpoly Paper5FrobeniusParity Paper5ExtensionHasse Paper5AnalyticEuler CubicGeometricTorsionLowerBound CubicGeometricTorsionUnbounded CubicGeometricTorsionOnSpecInt CubicGeometricTorsionStrata"
