NoSection NodalSwapConductorUnit NodalConductorSequence NodalConductorHZero CertifiedTorsorBaseChange CertifiedTorsorSpectrumTrace CertifiedTorsorSplit CertifiedTorsorSplitTrace CertifiedTorsorBaseChangeSplitTrace NodalSwapCoverAffineTrace AffineEtaleTensorPresentation NodalSwapCoverSheafTrace NodalSwapCoverLocalTrace SheafObjectwiseKernel NodalSwapCoverHOne NodalSwapCoverFullTrace NodalNormalizationHOneComparison NodalConductorHOne PushoutShortExact OpenEtaleExtendShortExact
jobs:
  pinned:
    name: Vendored Mathlib
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    concurrency:
      group: manuscript-proofs-vendored-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          lint: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Record vendored proof imports
        id: vendored-inputs
        shell: bash
        run: |
          set -euo pipefail
          proof_dir=PrimalitySheafVerification/ManuscriptAudit
          read -ra proofs <<< "$CORE_PROOFS NodalCotangent CubicTraceInfinitude CuspScheme CuspConductorSquare SkyscraperUniqueRefinements SmallEtaleGeometricBaseChange ClosedRationalPointUniqueRefinements ClosedRationalSkyscraperOffSupport SmallEtaleGeometricSkyscraperPushforward CuspOriginGeometricDirectImage RationalPointStalkConservative NestedOpenRationalOriginQuotient GeometricSkyscraperHZeroEvaluation RationalPointQuotientHZero EtaleMayerVietorisOrdinary EtaleMayerVietorisNontrivial EtaleMayerVietorisLocalSection EtaleMayerVietorisConnecting EtaleMayerVietorisQuotient CuspOpenOriginSequence CuspProperCompactification NodalProjectiveClosure NodalProjectiveBoundary CuspProperBoundary EtaleConstantHZero CuspRationalInfinity CuspInfinitySupport NodalInfinitySupport CuspYChartAlgebra NodalYChartImmersion NodalSmoothMobiusY NodalSmoothCharts NodalYChartOverlap NodalYChartOverlapPlane NodalYChartImage NodalProperYChart NodalChartIntersection NodalYChartPrincipalOpen NodalSmoothLocus TwoOpenSchemeGlue NodalSmoothLocusOverlap NodalProjectiveNormalization NodalNormalizationZChart NodalNormalizationZPolynomial NodalSmoothMobiusTransition NodalSmoothLocusGm NodalSmoothLocusCohomology NodalSwapCoverOverlap NodalSwapCoverOverlapObject NodalProjectiveHOne NodalProjectiveHOneRestriction NodalRationalInfinity CuspYChartOverlapAlgebra CuspYChartImage CuspProperYChart CuspChartIntersection CuspChartIntersectionMaps CuspCompactSupportSequence CuspCompactSupportHigherComparison CuspCompactSupportHZero CuspCompactSupportLowDegrees CuspCompactSupportEuler CuspCompactSupportExcess CuspCompactSupportRank CuspCompactSupportProjectiveComparison NodalCompactSupportHOne NodalCompactSupportHOneNontrivial NodalProjectiveHOneExact CuspEtaleCommonQuotient CuspFiniteEtaleBases CuspEtaleConductorPatch CuspMilnorCoefficients CuspPatchedFiniteProjective CuspNormalizationRecovery CuspPatchedFiniteEtale CuspFiniteEtaleDescent CuspEtaleDescent CuspEtaleHom CuspAffineEtale CuspAffineEtaleEquivalence CuspSmallEtaleCohomology CuspCompactSupportAbsoluteHOne CuspCompactSupportAbsoluteEuler CuspCompactSupportDegreeTwo CuspCompactSupportDegreeTwoQuotient GeometricCuspBump ArithmeticCuspBump CuspNormalizationConstants ArithmeticCuspNormalization CuspPlaneSmoothness CuspCotangent Paper3OverlapCotangent PadicLogNonzero FiniteFieldPointCount CubicJacobiBound CubicCharacterMultiplicity CubicHasseBound CubicJacobiRoots CubicJacobiExtension CubicOddExtensionTrace CubicPointCountModuloThree CubicSquareExtensionTrace Paper5ExtensionRecurrence Paper5NonsplitExtensionRecurrence Paper5ActualEulerRadius Paper5FixedGeometricTorsion Paper5FixedPositiveGeometricTorsion CubicFiniteTorsion CubicGeometricTorsion CubicGeometricConverse CubicTraceClassification CubicGeometricClassification Paper5PrintedSupersingular Paper5PrintedActualExtensionCounts Paper5ActualHasseWeil Paper5FrobeniusModTwo Paper5FrobeniusParity Paper5ExtensionHasse Paper5AnalyticEuler CubicGeometricTorsionLowerBound CubicGeometricTorsionUnbounded CubicGeometricTorsionOnSpecInt CubicGeometricTorsionStrata Spt2BenchmarkLength ThetaChosenQuotientAnalysis"
          {
            for proof in "${proofs[@]}"; do
              awk '$1 == "import" && $2 ~ /^Mathlib(\.|$)/ {print $2}' "$proof_dir/$proof.lean"
            done
            awk '$1 == "import" && $2 ~ /^Mathlib(\.|$)/ {print $2}' \
              PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          } | sort -u > "${RUNNER_TEMP}/manuscript-proof-imports.txt"
          test -s "${RUNNER_TEMP}/manuscript-proof-imports.txt"
          printf 'hash=%s\n' "$(sha256sum "${RUNNER_TEMP}/manuscript-proof-imports.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          environment="$(git ls-tree HEAD Mathlib Mathlib.lean lakefile.lean lakefile.toml lake-manifest.json lean-toolchain |
            sha256sum | cut -d ' ' -f 1)"
          printf 'environment=%s\n' "$environment" >> "$GITHUB_OUTPUT"
      - name: Restore compiled modules
        id: compiled
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake
          key: manuscript-lean-imports-0e026509-linux-arm64-${{ steps.vendored-inputs.outputs.hash }}
          restore-keys: manuscript-lean-imports-0e026509-linux-arm64-
      - name: Build the required vendored modules
        id: vendored-dependencies
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t modules < "${RUNNER_TEMP}/manuscript-proof-imports.txt"
          : > "${RUNNER_TEMP}/manuscript-dependencies.log"
          status=0
          lake build "${modules[@]}" > "${RUNNER_TEMP}/manuscript-dependencies.log" 2>&1 || status=$?
          tail -n 60 "${RUNNER_TEMP}/manuscript-dependencies.log"
          exit "$status"
      - name: Keep the compiled modules on GitHub
        continue-on-error: true
        if: steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake
          key: ${{ steps.compiled.outputs.cache-primary-key }}
      - name: Restore checked vendored proof files
        if: steps.vendored-dependencies.outcome == 'success'
        id: vendored-checked-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/manuscript-vendored-proof-modules
          key: manuscript-vendored-checked-linux-arm64-v1-${{ steps.vendored-inputs.outputs.environment }}-${{ github.sha }}
          restore-keys: manuscript-vendored-checked-linux-arm64-v1-${{ steps.vendored-inputs.outputs.environment }}-
      - name: Build the original project modules needed by the proofs
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/manuscript-proof-project-imports.log"
          status=0
          lake build PrimalitySheafVerification.Spt2 PrimalitySheafVerification.Spt3 PrimalitySheafVerification.Spt5 > "$log" 2>&1 || status=$?
          tail -n 60 "$log"
          if [[ "$status" != 0 ]]; then exit "$status"; fi
          # A successful Lake build may retain some objects solely in its artifact cache.
          # The proof job invokes Lean directly, so materialize each required module.
          project_lib="$GITHUB_WORKSPACE/.lake/build/lib/lean/PrimalitySheafVerification"
          mkdir -p "$project_lib"
          for project in Spt2 Spt3 Spt5; do
            if [[ ! -s "$project_lib/$project.olean" ]]; then
              lake env lean --root="$GITHUB_WORKSPACE" -o "$project_lib/$project.olean" \
                "PrimalitySheafVerification/$project.lean" 2>&1 | tee -a "$log"
            fi
          done
          project=Mock2_FunctionalAnalysis
          source="PrimalitySheafVerification/$project.lean"
          cache_lib="${RUNNER_TEMP}/manuscript-vendored-proof-modules/PrimalitySheafVerification"
          source_hash="$(sha256sum < "$source" | cut -d ' ' -f 1)"
          mkdir -p "$cache_lib"
          stamp="$cache_lib/$project.source-sha256"
          if [[ ! -s "$cache_lib/$project.olean" || ! -f "$stamp" ||
                "$(cat "$stamp")" != "$source_hash" ]]; then
            status=0
            lake build "PrimalitySheafVerification.$project" >> "$log" 2>&1 || status=$?
            tail -n 30 "$log"
            if [[ "$status" != 0 ]]; then exit "$status"; fi
            if [[ ! -s "$project_lib/$project.olean" ]]; then
              lake env lean --root="$GITHUB_WORKSPACE" -o "$project_lib/$project.olean" \
                "$source" 2>&1 | tee -a "$log"
            fi
            cp "$project_lib/$project.olean"* "$cache_lib/"
            printf '%s\n' "$source_hash" > "$stamp"
          fi
      - name: Check the proofs and their transitive axioms
        id: vendored-check
        if: ${{ !cancelled() && steps.vendored-dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          proof_dir=PrimalitySheafVerification/ManuscriptAudit
          compiled="${RUNNER_TEMP}/manuscript-vendored-proof-modules"
          records="$compiled/checks"
          project_compiled="$GITHUB_WORKSPACE/.lake/build/lib/lean"
          mkdir -p "$compiled/$proof_dir" "$records"
          # Lean resolves the first PrimalitySheafVerification directory in LEAN_PATH.
          # Place the original modules beside the checked audit modules.
          for project in Spt2 Spt3 Spt5; do
            for artifact in "$project_compiled/PrimalitySheafVerification/$project.olean"*; do
              cp "$artifact" "$compiled/PrimalitySheafVerification/"
            done
          done
          audit_lean_path="$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$compiled:$project_compiled:$audit_lean_path"
          project_stamp="$(
            sha256sum PrimalitySheafVerification/Spt{2,3,5}.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | sha256sum | cut -d ' ' -f 1
          )"
          status=0
          read -ra proofs <<< "$CORE_PROOFS NodalCotangent CubicTraceInfinitude CuspScheme CuspConductorSquare SkyscraperUniqueRefinements SmallEtaleGeometricBaseChange ClosedRationalPointUniqueRefinements ClosedRationalSkyscraperOffSupport SmallEtaleGeometricSkyscraperPushforward CuspOriginGeometricDirectImage RationalPointStalkConservative NestedOpenRationalOriginQuotient GeometricSkyscraperHZeroEvaluation RationalPointQuotientHZero EtaleMayerVietorisOrdinary EtaleMayerVietorisNontrivial EtaleMayerVietorisLocalSection EtaleMayerVietorisConnecting EtaleMayerVietorisQuotient CuspOpenOriginSequence CuspProperCompactification NodalProjectiveClosure NodalProjectiveBoundary CuspProperBoundary EtaleConstantHZero CuspRationalInfinity CuspInfinitySupport NodalInfinitySupport CuspYChartAlgebra NodalYChartImmersion NodalSmoothMobiusY NodalSmoothCharts NodalYChartOverlap NodalYChartOverlapPlane NodalYChartImage NodalProperYChart NodalChartIntersection NodalYChartPrincipalOpen NodalSmoothLocus TwoOpenSchemeGlue NodalSmoothLocusOverlap NodalProjectiveNormalization NodalNormalizationZChart NodalNormalizationZPolynomial NodalSmoothMobiusTransition NodalSmoothLocusGm NodalSmoothLocusCohomology NodalSwapCoverOverlap NodalSwapCoverOverlapObject NodalProjectiveHOne NodalProjectiveHOneRestriction NodalRationalInfinity CuspYChartOverlapAlgebra CuspYChartImage CuspProperYChart CuspChartIntersection CuspChartIntersectionMaps CuspCompactSupportSequence CuspCompactSupportHigherComparison CuspCompactSupportHZero CuspCompactSupportLowDegrees CuspCompactSupportEuler CuspCompactSupportExcess CuspCompactSupportRank CuspCompactSupportProjectiveComparison NodalCompactSupportHOne NodalCompactSupportHOneNontrivial NodalProjectiveHOneExact CuspEtaleCommonQuotient CuspFiniteEtaleBases CuspEtaleConductorPatch CuspMilnorCoefficients CuspPatchedFiniteProjective CuspNormalizationRecovery CuspPatchedFiniteEtale CuspFiniteEtaleDescent CuspEtaleDescent CuspEtaleHom CuspAffineEtale CuspAffineEtaleEquivalence CuspSmallEtaleCohomology CuspCompactSupportAbsoluteHOne CuspCompactSupportAbsoluteEuler CuspCompactSupportDegreeTwo CuspCompactSupportDegreeTwoQuotient GeometricCuspBump ArithmeticCuspBump CuspNormalizationConstants ArithmeticCuspNormalization CuspPlaneSmoothness CuspCotangent Paper3OverlapCotangent PadicLogNonzero FiniteFieldPointCount CubicJacobiBound CubicCharacterMultiplicity CubicHasseBound CubicJacobiRoots CubicJacobiExtension CubicOddExtensionTrace CubicPointCountModuloThree CubicSquareExtensionTrace Paper5ExtensionRecurrence Paper5NonsplitExtensionRecurrence Paper5ActualEulerRadius Paper5FixedGeometricTorsion Paper5FixedPositiveGeometricTorsion CubicFiniteTorsion CubicGeometricTorsion CubicGeometricConverse CubicTraceClassification CubicGeometricClassification Paper5PrintedSupersingular Paper5PrintedActualExtensionCounts Paper5ActualHasseWeil Paper5FrobeniusModTwo Paper5FrobeniusParity Paper5ExtensionHasse Paper5AnalyticEuler CubicGeometricTorsionLowerBound CubicGeometricTorsionUnbounded CubicGeometricTorsionOnSpecInt CubicGeometricTorsionStrata Spt2BenchmarkLength ThetaChosenQuotientAnalysis"
          for proof in "${proofs[@]}"; do
            echo "Checking $proof_dir/$proof.lean" | tee -a "${RUNNER_TEMP}/manuscript-proofs.log"
            source="$GITHUB_WORKSPACE/$proof_dir/$proof.lean"
            object="$compiled/$proof_dir/$proof.olean"
            stamp="$records/$proof.sha256"
            proof_log="$records/$proof.log"
            missing=0
            deps=()
            while IFS= read -r prerequisite; do
              if [[ ! -f "$compiled/$proof_dir/$prerequisite.olean" ||
                    ! -s "$records/$prerequisite.sha256" ]]; then
                echo "Missing current build of $prerequisite" | tee -a "${RUNNER_TEMP}/manuscript-proofs.log"
                missing=1
              else
                deps+=("$records/$prerequisite.sha256")
              fi
            done < <(awk '$1 == "import" && $2 ~ /^PrimalitySheafVerification\.ManuscriptAudit\./ {sub(/^.*\./,"",$2); print $2}' "$source")
            if [[ "$missing" == 1 ]]; then
              rm -f "$object" "$stamp" "$proof_log"
              status=1
              continue
            fi
            fingerprint="$({
              sha256sum < "$source"
              for dep in "${deps[@]}"; do cat "$dep"; done
              if awk '$1 == "import" && $2 ~ /^PrimalitySheafVerification\.(Spt[235]|Mock2_FunctionalAnalysis)$/ {found=1} END {exit !found}' "$source"; then
                printf '%s\n' "$project_stamp"
              fi
            } | sha256sum | cut -d ' ' -f 1)"
            if [[ -f "$object" && -f "$proof_log" && -f "$stamp" &&
                  "$(cat "$stamp")" == "$fingerprint" ]]; then
              echo "Reused checked source and imports: $fingerprint" | tee -a "${RUNNER_TEMP}/manuscript-proofs.log"
              cat "$proof_log" | tee -a "${RUNNER_TEMP}/manuscript-proofs.log"
              continue
            fi
            rm -f "$object" "$stamp" "$proof_log"
            if timeout --verbose --kill-after=15s 5m lean --root="$GITHUB_WORKSPACE" \
                -o "$object" "$source" 2>&1 |
                tee "$proof_log" | tee -a "${RUNNER_TEMP}/manuscript-proofs.log"; then
              printf '%s\n' "$fingerprint" > "$stamp"
            else
              rm -f "$object" "$stamp" "$proof_log"
              status=1
            fi
          done
          exit "$status"
      - name: Keep checked vendored proof files on GitHub
        if: ${{ !cancelled() && steps.vendored-check.outcome != 'skipped' && steps.vendored-checked-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/manuscript-vendored-proof-modules
          key: ${{ steps.vendored-checked-cache.outputs.cache-primary-key }}
      - name: Keep the vendored-build logs on GitHub
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manuscript-proofs-vendored-${{ github.sha }}
          path: |
            ${{ runner.temp }}/manuscript-dependencies.log
            ${{ runner.temp }}/manuscript-proof-project-imports.log
            ${{ runner.temp }}/manuscript-proofs.log
          if-no-files-found: warn
          retention-days: 30

  padic:
    name: Vendored Mathlib and p-adic project sources
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 200
    concurrency:
      group: manuscript-padic-vendored-cached-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          lint: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Restore already compiled modules
        id: padic-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake
          key: manuscript-spt1-0e026509-linux-arm64-${{ hashFiles('PrimalitySheafVerification/Spt1.lean') }}
          restore-keys: manuscript-lean-imports-0e026509-linux-arm64-
      - name: Build Spt1, Spt6 and their imports
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/manuscript-spt1-build.log"
          status=0
          lake build PrimalitySheafVerification.Spt1 PrimalitySheafVerification.Spt6 PrimalitySheafVerification.ManuscriptAudit.PadicBinomialLimit > "$log" 2>&1 || status=$?
          tail -n 60 "$log"
          exit "$status"
      - name: Cache compiled Spt1 on GitHub
        continue-on-error: true
        if: steps.padic-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake
          key: ${{ steps.padic-cache.outputs.cache-primary-key }}
      - name: Check the actual logarithm series proof
        shell: bash
        run: |
          set -euo pipefail
          status=0
          proof_dir=PrimalitySheafVerification/ManuscriptAudit
          compiled="$GITHUB_WORKSPACE/.lake/build/lib/lean"
          mkdir -p "$compiled/$proof_dir"
          audit_lean_path="$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$compiled:$audit_lean_path"
          for proof in PadicLogNonzero PadicRemainder PadicCertificates PadicLipschitz PadicExactBridge PadicCoefficientTransfer PadicSpt6Bridge; do
            lean --root="$GITHUB_WORKSPACE" -o "$compiled/$proof_dir/$proof.olean" \
              "$GITHUB_WORKSPACE/$proof_dir/$proof.lean" 2>&1 |
                tee -a "${RUNNER_TEMP}/manuscript-spt1-proof.log" || status=1
          done
          exit "$status"
      - name: Keep the Spt1 check logs on GitHub
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manuscript-padic-vendored-${{ github.sha }}
          path: |
            ${{ runner.temp }}/manuscript-spt1-build.log
            ${{ runner.temp }}/manuscript-spt1-proof.log
          if-no-files-found: warn
          retention-days: 30

  upstream:
    name: Upstream Mathlib compatibility
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    concurrency:
      group: manuscript-proofs-upstream-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: 79d0395a1825a6264ad5d269e35e60537518955e
          path: upstream-mathlib
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          lint: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
          lake-package-directory: upstream-mathlib
      - name: Retrieve the upstream module cache
        shell: bash
        working-directory: upstream-mathlib
        run: |
          set -euo pipefail
          proof_dir=../PrimalitySheafVerification/ManuscriptAudit
          read -ra proofs <<< "$CORE_PROOFS CubicTraceInfinitude CuspScheme CuspConductorSquare SkyscraperUniqueRefinements SmallEtaleGeometricBaseChange ClosedRationalPointUniqueRefinements ClosedRationalSkyscraperOffSupport SmallEtaleGeometricSkyscraperPushforward CuspOriginGeometricDirectImage RationalPointStalkConservative NestedOpenRationalOriginQuotient GeometricSkyscraperHZeroEvaluation RationalPointQuotientHZero EtaleMayerVietorisOrdinary EtaleMayerVietorisNontrivial EtaleMayerVietorisLocalSection EtaleMayerVietorisConnecting EtaleMayerVietorisQuotient CuspOpenOriginSequence CuspProperCompactification NodalProjectiveClosure NodalProjectiveBoundary CuspProperBoundary EtaleConstantHZero CuspRationalInfinity CuspInfinitySupport NodalInfinitySupport CuspYChartAlgebra NodalYChartImmersion NodalSmoothMobiusY NodalSmoothCharts NodalYChartOverlap NodalYChartOverlapPlane NodalYChartImage NodalProperYChart NodalChartIntersection NodalYChartPrincipalOpen NodalSmoothLocus TwoOpenSchemeGlue NodalSmoothLocusOverlap NodalProjectiveNormalization NodalNormalizationZChart NodalNormalizationZPolynomial NodalSmoothMobiusTransition NodalSmoothLocusGm NodalSmoothLocusCohomology NodalSwapCoverOverlap NodalSwapCoverOverlapObject NodalProjectiveHOne NodalProjectiveHOneRestriction NodalRationalInfinity CuspYChartOverlapAlgebra CuspYChartImage CuspProperYChart CuspChartIntersection CuspChartIntersectionMaps CuspCompactSupportSequence CuspCompactSupportHigherComparison CuspCompactSupportHZero CuspCompactSupportLowDegrees CuspCompactSupportEuler CuspCompactSupportExcess CuspCompactSupportRank CuspCompactSupportProjectiveComparison NodalCompactSupportHOne NodalCompactSupportHOneNontrivial NodalProjectiveHOneExact CuspEtaleCommonQuotient CuspFiniteEtaleBases CuspEtaleConductorPatch CuspMilnorCoefficients CuspPatchedFiniteProjective CuspNormalizationRecovery CuspPatchedFiniteEtale CuspFiniteEtaleDescent CuspEtaleDescent CuspEtaleHom CuspAffineEtale CuspAffineEtaleEquivalence CuspSmallEtaleCohomology CuspCompactSupportAbsoluteHOne CuspCompactSupportAbsoluteEuler CuspCompactSupportDegreeTwo CuspCompactSupportDegreeTwoQuotient GeometricCuspBump ArithmeticCuspBump CuspNormalizationConstants ArithmeticCuspNormalization CuspPlaneSmoothness PadicLogNonzero FiniteFieldPointCount CubicJacobiBound CubicCharacterMultiplicity CubicHasseBound CubicJacobiRoots CubicJacobiExtension CubicOddExtensionTrace CubicPointCountModuloThree CubicSquareExtensionTrace Paper5ExtensionRecurrence Paper5NonsplitExtensionRecurrence Paper5ActualEulerRadius Paper5FixedGeometricTorsion Paper5FixedPositiveGeometricTorsion CubicFiniteTorsion CubicGeometricTorsion CubicGeometricConverse CubicTraceClassification CubicGeometricClassification Paper5PrintedSupersingular Paper5PrintedActualExtensionCounts Paper5ActualHasseWeil Paper5FrobeniusModTwo Paper5FrobeniusParity Paper5ExtensionHasse Paper5AnalyticEuler CubicGeometricTorsionLowerBound CubicGeometricTorsionUnbounded CubicGeometricTorsionOnSpecInt CubicGeometricTorsionStrata"
          mapfile -t modules < <(
            for proof in "${proofs[@]}"; do
              awk '$1 == "import" && $2 ~ /^Mathlib(\.|$)/ {print $2}' "$proof_dir/$proof.lean"
            done | sort -u
          )
          test "${#modules[@]}" -gt 0
          log="${RUNNER_TEMP}/manuscript-upstream-dependencies.log"
          if ! lake exe cache get "${modules[@]}" 2>&1 | tee "$log"; then
            echo "Upstream cache was unavailable. Building required modules." | tee -a "$log"
          fi
          lake build "${modules[@]}" 2>&1 | tee -a "$log"
      - name: Restore checked Lean proof files
        id: upstream-checked-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/manuscript-proof-modules
          key: manuscript-upstream-checked-linux-arm64-79d0395a-v1-${{ github.sha }}
          restore-keys: manuscript-upstream-checked-linux-arm64-79d0395a-v1-
      - name: Check the proofs with upstream Mathlib
        id: upstream-check
        shell: bash
        working-directory: upstream-mathlib
        run: |
          set -euo pipefail
          status=0
          compiled="${RUNNER_TEMP}/manuscript-proof-modules"
          package_path="PrimalitySheafVerification/ManuscriptAudit"
          records="$compiled/checks"
          output="${RUNNER_TEMP}/manuscript-proofs-upstream.log"
          mkdir -p "$compiled/$package_path" "$records"
          : > "$output"
          audit_lean_path="$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$compiled:$audit_lean_path"
          read -ra proofs <<< "$CORE_PROOFS CubicTraceInfinitude CuspScheme CuspConductorSquare SkyscraperUniqueRefinements SmallEtaleGeometricBaseChange ClosedRationalPointUniqueRefinements ClosedRationalSkyscraperOffSupport SmallEtaleGeometricSkyscraperPushforward CuspOriginGeometricDirectImage RationalPointStalkConservative NestedOpenRationalOriginQuotient GeometricSkyscraperHZeroEvaluation RationalPointQuotientHZero EtaleMayerVietorisOrdinary EtaleMayerVietorisNontrivial EtaleMayerVietorisLocalSection EtaleMayerVietorisConnecting EtaleMayerVietorisQuotient CuspOpenOriginSequence CuspProperCompactification NodalProjectiveClosure NodalProjectiveBoundary CuspProperBoundary EtaleConstantHZero CuspRationalInfinity CuspInfinitySupport NodalInfinitySupport CuspYChartAlgebra NodalYChartImmersion NodalSmoothMobiusY NodalSmoothCharts NodalYChartOverlap NodalYChartOverlapPlane NodalYChartImage NodalProperYChart NodalChartIntersection NodalYChartPrincipalOpen NodalSmoothLocus TwoOpenSchemeGlue NodalSmoothLocusOverlap NodalProjectiveNormalization NodalNormalizationZChart NodalNormalizationZPolynomial NodalSmoothMobiusTransition NodalSmoothLocusGm NodalSmoothLocusCohomology NodalSwapCoverOverlap NodalSwapCoverOverlapObject NodalProjectiveHOne NodalProjectiveHOneRestriction NodalRationalInfinity CuspYChartOverlapAlgebra CuspYChartImage CuspProperYChart CuspChartIntersection CuspChartIntersectionMaps CuspCompactSupportSequence CuspCompactSupportHigherComparison CuspCompactSupportHZero CuspCompactSupportLowDegrees CuspCompactSupportEuler CuspCompactSupportExcess CuspCompactSupportRank CuspCompactSupportProjectiveComparison NodalCompactSupportHOne NodalCompactSupportHOneNontrivial NodalProjectiveHOneExact CuspEtaleCommonQuotient CuspFiniteEtaleBases CuspEtaleConductorPatch CuspMilnorCoefficients CuspPatchedFiniteProjective CuspNormalizationRecovery CuspPatchedFiniteEtale CuspFiniteEtaleDescent CuspEtaleDescent CuspEtaleHom CuspAffineEtale CuspAffineEtaleEquivalence CuspSmallEtaleCohomology CuspCompactSupportAbsoluteHOne CuspCompactSupportAbsoluteEuler CuspCompactSupportDegreeTwo CuspCompactSupportDegreeTwoQuotient GeometricCuspBump ArithmeticCuspBump CuspNormalizationConstants ArithmeticCuspNormalization CuspPlaneSmoothness PadicLogNonzero FiniteFieldPointCount CubicJacobiBound CubicCharacterMultiplicity CubicHasseBound CubicJacobiRoots CubicJacobiExtension CubicOddExtensionTrace CubicPointCountModuloThree CubicSquareExtensionTrace Paper5ExtensionRecurrence Paper5NonsplitExtensionRecurrence Paper5ActualEulerRadius Paper5FixedGeometricTorsion Paper5FixedPositiveGeometricTorsion CubicFiniteTorsion CubicGeometricTorsion CubicGeometricConverse CubicTraceClassification CubicGeometricClassification Paper5PrintedSupersingular Paper5PrintedActualExtensionCounts Paper5ActualHasseWeil Paper5FrobeniusModTwo Paper5FrobeniusParity Paper5ExtensionHasse Paper5AnalyticEuler CubicGeometricTorsionLowerBound CubicGeometricTorsionUnbounded CubicGeometricTorsionOnSpecInt CubicGeometricTorsionStrata"
          for proof in "${proofs[@]}"; do
            source="$GITHUB_WORKSPACE/$package_path/$proof.lean"
            stamp="$records/$proof.sha256"
            proof_log="$records/$proof.log"
            object="$compiled/$package_path/$proof.olean"
            echo "Checking $package_path/$proof.lean" | tee -a "$output"
            deps=()
            missing=0
            while IFS= read -r prerequisite; do
              if [[ ! -s "$records/$prerequisite.sha256" ||
                    ! -f "$compiled/$package_path/$prerequisite.olean" ]]; then
                echo "Missing checked import $prerequisite" | tee -a "$output"
                missing=1
              else
                deps+=("$records/$prerequisite.sha256")
              fi
            done < <(awk '$1 == "import" && $2 ~ /^PrimalitySheafVerification\.ManuscriptAudit\./ {sub(/^.*\./,"",$2); print $2}' "$source")
            if [[ "$missing" == 1 ]]; then
              status=1
              rm -f "$object" "$stamp" "$proof_log"
              continue
            fi
            fingerprint="$({
              sha256sum < "$source"
              for dep in "${deps[@]}"; do cat "$dep"; done
            } | sha256sum | cut -d ' ' -f 1)"
            if [[ -f "$object" && -f "$proof_log" && -f "$stamp" &&
                  "$(cat "$stamp")" == "$fingerprint" ]]; then
              echo "Reused checked source and imports: $fingerprint" | tee -a "$output"
              cat "$proof_log" | tee -a "$output"
              continue
            fi
            rm -f "$object" "$stamp" "$proof_log"
            if timeout --verbose --kill-after=15s 5m lean --root="$GITHUB_WORKSPACE" -o "$object" "$source" 2>&1 |
                tee "$proof_log" | tee -a "$output"; then
              printf '%s\n' "$fingerprint" > "$stamp"
            else
              status=1
              rm -f "$object" "$stamp" "$proof_log"
            fi
          done
          exit "$status"
      - name: Keep checked Lean proof files on GitHub
        if: ${{ !cancelled() && steps.upstream-check.outcome != 'skipped' && steps.upstream-checked-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/manuscript-proof-modules
          key: ${{ steps.upstream-checked-cache.outputs.cache-primary-key }}
      - name: Keep the upstream compatibility log on GitHub
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manuscript-proofs-upstream-${{ github.sha }}
          path: |
            ${{ runner.temp }}/manuscript-upstream-dependencies.log
            ${{ runner.temp }}/manuscript-proofs-upstream.log
          if-no-files-found: warn
          retention-days: 30
