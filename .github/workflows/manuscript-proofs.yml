              echo "Reused checked source and imports: $fingerprint" | tee -a "$output"
              cat "$proof_log" | tee -a "$output"
              continue
            fi
            rm -f "$object" "$stamp" "$proof_log"
            if timeout --verbose --kill-after=15s 5m lean --root="$GITHUB_WORKSPACE" -o "$object" "$source" 2>&1 |
