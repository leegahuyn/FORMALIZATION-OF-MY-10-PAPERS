          for proof in "${proofs[@]}"; do
            echo "Checking $proof_dir/$proof.lean" | tee -a "${RUNNER_TEMP}/manuscript-proofs.log"
            source="$GITHUB_WORKSPACE/$proof_dir/$proof.lean"
            object="$compiled/$proof_dir/$proof.olean"
            stamp="$records/$proof.sha256"
            proof_log="$records/$proof.log"
            missing=0
            deps=()
            while IFS= read -r prerequisite; do
              if [[ ! -f "$compiled/$proof_dir/$prerequisite.olean" ||
                    ! -s "$records/$prerequisite.sha256" ]]; then
                echo "Missing current build of $prerequisite" | tee -a "${RUNNER_TEMP}/manuscript-proofs.log"
                missing=1
              else
                deps+=("$records/$prerequisite.sha256")
              fi
            done < <(awk '$1 == "import" && $2 ~ /^PrimalitySheafVerification\.ManuscriptAudit\./ {sub(/^.*\./,"",$2); print $2}' "$source")
            if [[ "$missing" == 1 ]]; then
              rm -f "$object" "$stamp" "$proof_log"
              status=1
              continue
            fi
            fingerprint="$({
              sha256sum < "$source"
              for dep in "${deps[@]}"; do cat "$dep"; done
              if awk '$1 == "import" && $2 ~ /^PrimalitySheafVerification\.(Spt[235]|Mock2_FunctionalAnalysis)$/ {found=1} END {exit !found}' "$source"; then
                printf '%s\n' "$project_stamp"
              fi
            } | sha256sum | cut -d ' ' -f 1)"
            if [[ -f "$object" && -f "$proof_log" && -f "$stamp" &&
                  "$(cat "$stamp")" == "$fingerprint" ]]; then
              echo "Reused checked source and imports: $fingerprint" | tee -a "${RUNNER_TEMP}/manuscript-proofs.log"
              cat "$proof_log" | tee -a "${RUNNER_TEMP}/manuscript-proofs.log"
              continue
            fi
            rm -f "$object" "$stamp" "$proof_log"
            if timeout --verbose --kill-after=15s 5m lean --root="$GITHUB_WORKSPACE" \
                -o "$object" "$source" 2>&1 |
                tee "$proof_log" | tee -a "${RUNNER_TEMP}/manuscript-proofs.log"; then
              printf '%s\n' "$fingerprint" > "$stamp"
            else
              rm -f "$object" "$stamp" "$proof_log"
              status=1
            fi
          done
          exit "$status"
      - name: Keep checked vendored proof files on GitHub
        if: ${{ !cancelled() && steps.vendored-check.outcome != 'skipped' && steps.vendored-checked-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/manuscript-vendored-proof-modules
          key: ${{ steps.vendored-checked-cache.outputs.cache-primary-key }}
      - name: Keep the vendored-build logs on GitHub
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manuscript-proofs-vendored-${{ github.sha }}
          path: |
            ${{ runner.temp }}/manuscript-dependencies.log
            ${{ runner.temp }}/manuscript-proof-project-imports.log
            ${{ runner.temp }}/manuscript-proofs.log
          if-no-files-found: warn
          retention-days: 30

  padic:
    name: Vendored Mathlib and p-adic project sources
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 200
    concurrency:
      group: manuscript-padic-vendored-cached-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          lint: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Restore already compiled modules
        id: padic-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake
          key: manuscript-spt1-0e026509-linux-arm64-${{ hashFiles('PrimalitySheafVerification/Spt1.lean') }}
          restore-keys: manuscript-lean-imports-0e026509-linux-arm64-
      - name: Build Spt1, Spt6 and their imports
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/manuscript-spt1-build.log"
          status=0
          lake build PrimalitySheafVerification.Spt1 PrimalitySheafVerification.Spt6 PrimalitySheafVerification.ManuscriptAudit.PadicBinomialLimit > "$log" 2>&1 || status=$?
          tail -n 60 "$log"
          exit "$status"
      - name: Cache compiled Spt1 on GitHub
        continue-on-error: true
        if: steps.padic-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake
          key: ${{ steps.padic-cache.outputs.cache-primary-key }}
      - name: Check the actual logarithm series proof
        shell: bash
        run: |
          set -euo pipefail
          status=0
          proof_dir=PrimalitySheafVerification/ManuscriptAudit
          compiled="$GITHUB_WORKSPACE/.lake/build/lib/lean"
          mkdir -p "$compiled/$proof_dir"
          audit_lean_path="$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$compiled:$audit_lean_path"
          for proof in PadicLogNonzero PadicRemainder PadicCertificates PadicLipschitz PadicExactBridge PadicCoefficientTransfer PadicSpt6Bridge; do
            lean --root="$GITHUB_WORKSPACE" -o "$compiled/$proof_dir/$proof.olean" \
              "$GITHUB_WORKSPACE/$proof_dir/$proof.lean" 2>&1 |
                tee -a "${RUNNER_TEMP}/manuscript-spt1-proof.log" || status=1
          done
          exit "$status"
      - name: Keep the Spt1 check logs on GitHub
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manuscript-padic-vendored-${{ github.sha }}
          path: |
            ${{ runner.temp }}/manuscript-spt1-build.log
            ${{ runner.temp }}/manuscript-spt1-proof.log
          if-no-files-found: warn
          retention-days: 30

