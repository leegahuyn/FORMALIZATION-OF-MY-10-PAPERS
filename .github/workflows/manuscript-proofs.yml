name: Manuscript claim proofs
on:
  push:
    branches: [codex/overleaf-bundle-formalization]
    paths:
      - '.github/workflows/manuscript-proofs.yml'
      - 'PrimalitySheafVerification/ManuscriptAudit/*.lean'
      - 'PrimalitySheafVerification/Spt5.lean'
      - 'PrimalitySheafVerification/Spt1.lean'
permissions:
  contents: read
env:
  CORE_PROOFS: LiteralRefutations ResidueCompatibility FixedProfile OddTheta CuspDelta ConstantPresheaf UnfoldedIntegral PointComplex CubicTrace ReciprocalWeight BackwardHeatModes AppellNumerator CrossCharacteristicTensor CuspAtOrigin ValuationProfiles FourierSelection
jobs:
  pinned:
    name: Vendored Mathlib
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    concurrency:
      group: manuscript-proofs-vendored-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          lint: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Record vendored proof imports
        id: vendored-inputs
        shell: bash
        run: |
          set -euo pipefail
          proof_dir=PrimalitySheafVerification/ManuscriptAudit
          read -ra proofs <<< "$CORE_PROOFS NodalCotangent CubicTraceInfinitude"
          for proof in "${proofs[@]}"; do
            awk '$1 == "import" && $2 ~ /^(Mathlib|PrimalitySheafVerification)(\.|$)/ {print $2}' "$proof_dir/$proof.lean"
          done | sort -u > "${RUNNER_TEMP}/manuscript-proof-imports.txt"
          test -s "${RUNNER_TEMP}/manuscript-proof-imports.txt"
          printf 'hash=%s\n' "$(sha256sum "${RUNNER_TEMP}/manuscript-proof-imports.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore compiled modules
        id: compiled
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake
          key: manuscript-lean-imports-0e026509-linux-arm64-${{ steps.vendored-inputs.outputs.hash }}
          restore-keys: manuscript-lean-imports-0e026509-linux-arm64-
      - name: Build the required vendored modules
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t modules < "${RUNNER_TEMP}/manuscript-proof-imports.txt"
          : > "${RUNNER_TEMP}/manuscript-dependencies.log"
          status=0
          lake build "${modules[@]}" > "${RUNNER_TEMP}/manuscript-dependencies.log" 2>&1 || status=$?
          tail -n 60 "${RUNNER_TEMP}/manuscript-dependencies.log"
          exit "$status"
      - name: Keep the compiled modules on GitHub
        continue-on-error: true
        if: steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake
          key: ${{ steps.compiled.outputs.cache-primary-key }}
      - name: Check the proofs and their transitive axioms
        shell: bash
        run: |
          set -euo pipefail
          proof_dir=PrimalitySheafVerification/ManuscriptAudit
          status=0
          read -ra proofs <<< "$CORE_PROOFS NodalCotangent CubicTraceInfinitude"
          for proof in "${proofs[@]}"; do
            echo "Checking $proof_dir/$proof.lean" | tee -a "${RUNNER_TEMP}/manuscript-proofs.log"
            lake env lean "$proof_dir/$proof.lean" 2>&1 | tee -a "${RUNNER_TEMP}/manuscript-proofs.log" || status=1
          done
          exit "$status"
      - name: Keep the vendored-build logs on GitHub
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manuscript-proofs-vendored-${{ github.sha }}
          path: |
            ${{ runner.temp }}/manuscript-dependencies.log
            ${{ runner.temp }}/manuscript-proofs.log
          if-no-files-found: warn
          retention-days: 30

  padic:
    name: Vendored Mathlib and Spt1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 200
    concurrency:
      group: manuscript-padic-vendored-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          lint: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Restore already compiled modules
        id: padic-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake
          key: manuscript-spt1-0e026509-linux-arm64-${{ hashFiles('PrimalitySheafVerification/Spt1.lean') }}
          restore-keys: manuscript-lean-imports-0e026509-linux-arm64-
      - name: Build Spt1 and its imports
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/manuscript-spt1-build.log"
          status=0
          lake build PrimalitySheafVerification.Spt1 > "$log" 2>&1 || status=$?
          tail -n 60 "$log"
          exit "$status"
      - name: Cache compiled Spt1 on GitHub
        continue-on-error: true
        if: steps.padic-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake
          key: ${{ steps.padic-cache.outputs.cache-primary-key }}
      - name: Check the actual logarithm series proof
        shell: bash
        run: |
          set -euo pipefail
          lake env lean PrimalitySheafVerification/ManuscriptAudit/PadicRemainder.lean 2>&1 |
            tee "${RUNNER_TEMP}/manuscript-spt1-proof.log"
      - name: Keep the Spt1 check logs on GitHub
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manuscript-padic-vendored-${{ github.sha }}
          path: |
            ${{ runner.temp }}/manuscript-spt1-build.log
            ${{ runner.temp }}/manuscript-spt1-proof.log
          if-no-files-found: warn
          retention-days: 30

  upstream:
    name: Upstream Mathlib compatibility
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    concurrency:
      group: manuscript-proofs-upstream-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: 79d0395a1825a6264ad5d269e35e60537518955e
          path: upstream-mathlib
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          lint: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
          lake-package-directory: upstream-mathlib
      - name: Retrieve the upstream module cache
        shell: bash
        working-directory: upstream-mathlib
        run: |
          set -euo pipefail
          proof_dir=../PrimalitySheafVerification/ManuscriptAudit
          read -ra proofs <<< "$CORE_PROOFS CubicTraceInfinitude"
          mapfile -t modules < <(
            for proof in "${proofs[@]}"; do
              awk '$1 == "import" && $2 ~ /^Mathlib(\.|$)/ {print $2}' "$proof_dir/$proof.lean"
            done | sort -u
          )
          test "${#modules[@]}" -gt 0
          log="${RUNNER_TEMP}/manuscript-upstream-dependencies.log"
          if ! lake exe cache get "${modules[@]}" 2>&1 | tee "$log"; then
            echo "Upstream cache was unavailable. Building required modules." | tee -a "$log"
          fi
          lake build "${modules[@]}" 2>&1 | tee -a "$log"
      - name: Check the proofs with upstream Mathlib
        shell: bash
        working-directory: upstream-mathlib
        run: |
          set -euo pipefail
          proof_dir=../PrimalitySheafVerification/ManuscriptAudit
          status=0
          read -ra proofs <<< "$CORE_PROOFS"
          for proof in "${proofs[@]}"; do
            echo "Checking $proof_dir/$proof.lean" | tee -a "${RUNNER_TEMP}/manuscript-proofs-upstream.log"
            lake env lean "$proof_dir/$proof.lean" 2>&1 | tee -a "${RUNNER_TEMP}/manuscript-proofs-upstream.log" || status=1
          done
          compiled="${RUNNER_TEMP}/manuscript-proof-modules"
          package_path="PrimalitySheafVerification/ManuscriptAudit"
          mkdir -p "$compiled/$package_path"
          if lake env lean --root="$GITHUB_WORKSPACE" -o "$compiled/$package_path/CubicTrace.olean" \
              "$GITHUB_WORKSPACE/$package_path/CubicTrace.lean" > "${RUNNER_TEMP}/cubic-compile.log" 2>&1; then
            audit_lean_path="$(lake env printenv LEAN_PATH)"
            echo "Checking $proof_dir/CubicTraceInfinitude.lean" | tee -a "${RUNNER_TEMP}/manuscript-proofs-upstream.log"
            LEAN_PATH="$compiled:$audit_lean_path" lean "$proof_dir/CubicTraceInfinitude.lean" 2>&1 |
              tee -a "${RUNNER_TEMP}/manuscript-proofs-upstream.log" || status=1
          else
            cat "${RUNNER_TEMP}/cubic-compile.log"
            status=1
          fi
          exit "$status"
      - name: Keep the upstream compatibility log on GitHub
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manuscript-proofs-upstream-${{ github.sha }}
          path: |
            ${{ runner.temp }}/manuscript-upstream-dependencies.log
            ${{ runner.temp }}/manuscript-proofs-upstream.log
          if-no-files-found: warn
          retention-days: 30
