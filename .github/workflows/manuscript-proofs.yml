name: Manuscript claim proofs
on:
  push:
    branches: [codex/overleaf-bundle-formalization]
    paths:
      - '.github/workflows/manuscript-proofs.yml'
      - 'PrimalitySheafVerification/ManuscriptAudit/*.lean'
      - 'PrimalitySheafVerification/Spt5.lean'
      - 'PrimalitySheafVerification/Spt1.lean'
      - 'PrimalitySheafVerification/Spt6.lean'
permissions:
  contents: read
env:
  CORE_PROOFS: LiteralRefutations ResidueCompatibility FixedProfile OddTheta CuspDelta ConstantPresheaf UnfoldedIntegral PointComplex FiveTermEuler DerivedSheafShift SpecIntContinuousSections ProEtDirectImage RationalProEtaleCoefficients RationalProEtaleClosedShift RationalProEtaleLocalization WeierstrassFrobeniusFixed CubicTrace Paper5FixedTraceZero Paper5FixedPositiveTraceZero ReciprocalWeight BackwardHeatModes AppellNumerator CrossCharacteristicTensor CuspAtOrigin ValuationProfiles FourierSelection ThetaHalfPeriod CommonParameterEuler JacobianLength AppellDoubleRidge BenchmarkOrigin WindowEndpoint PadicBinomialLimit LaurentUnits CuspPicard CuspPunctured CubicHasseCoefficient TentBoundaryActivity CuspRootCoefficients KummerEtale NodalNormalizationCoordinates FiniteFieldPowerSums EllipticFiniteDescent CauchySampling LaurentUnitRepresentation EnergyDissipationModal NoetherNormalization TracePairing ProfileRestriction KummerSiteCover KummerUnitsPresheaf KummerSheafSequence KummerUnitsSheaf KummerCohomologySequence KummerRootLabels KummerConstantCoefficients KummerKernel KummerAffineCohomology PrintedRademacherTail InverseHalfNormDescent CauchyContour DirichletEuler ScatteringNormalization MaassLaplacian Paper8XiShadow ThetaInfinityCusp LaurentEtaleCohomology TentRegularity FourierPositiveSigned FaithfullyFlatRankOne LiteralCuspTruncation HighInfinityCusp CompactModularCore ThreeCuspNeighborhoods TwoOpenDerivedComparison CyclicInclusionCokernel PrincipalOpenSectionLoss UnitCocycleTensor FaithfullyFlatCoalgebra MahlerTail MahlerContinuity AffineUnitDescent FixedCoverCechCounterexample FixedCoverGlobalDerived ClosedSupportDetection SkyscraperHOne ExactSupportDetection SpecIntSupportReduction ClosedPointCoproduct FiniteSkyscraperSumHOne ClosedPointCoproductStalk ClosedPointSupportDetection GenericPointSupportDetection SpecIntSkyscraperSumHOne CofiniteSupportDetection SpecIntExactDetection FinitePrimeSample SpecIntOpenSupport SpecIntCechDetection AffineEtaleCoverProduct AffineEtaleLiftingCover AffineEtaleProductGluing AffineEtaleTensorOverlap SheafH1Descent SheafSectionDifference AddCommGrpImageFactorization SheafCoboundaryLift AffineEtaleUnitCocycle AffineEtaleProductDescent AffineEtaleCuspHOne OriginMonomialLength OriginTjurinaInfiniteLength PrincipalOpenFiniteProfiles UnramifiedEqualizerSections CuspReductionBaseChange CuspUnramifiedNormalization CuspFlatNormalization CuspFlatUnramifiedSections SheafFreeAbelianLimits CuspNormalizationHom CuspFiniteEtaleCategory MaassPrintedFactorization SmallEtaleCohomologyComparison ArithmeticLineHOne ArithmeticResidueHOne ArithmeticLaurentHOne SmallEtaleCuspHOne CuspFrobenius SmoothGaugeBracket AffineAbsoluteFrobenius AffineRelativeFrobenius AffineFrobeniusFactorization EtaleRadicial EtaleOfSurjectiveSpecBaseChange RelativeFrobeniusEtale AffineEtaleRelativeFrobenius AffineFrobeniusPullback SmallEtaleBaseChange SmallEtaleSkyscraper SmallEtaleClosedResidue OpenEtaleExtension OpenEtaleExtensionStalk OpenEtaleExtensionInsideStalk OpenEtaleExtensionComposition OpenEtaleExtensionMono OpenEtaleExtensionCounit OpenEtaleExtensionQuotient OpenEtaleExtensionToSkyscraper GeometricSkyscraperHZero AffineEtaleBaseChange SmallEtaleEquivalenceCohomology SmoothGaugeCurvature PeriodicExactGauge ProjectedTwistedTrace ScalarTwistCompatibility RSMassGap SpectralQuarterShift WeylWindow EtaleSquareZeroLift EtaleSplitSquareZero MilnorStabilizedMatrix MilnorIdentityGluing MilnorCoordinatePatch MilnorProjectivePatch MilnorNormalizationMap MilnorNormalizationRecovery MilnorIdentityRecovery
jobs:
  pinned:
    name: Vendored Mathlib
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    concurrency:
      group: manuscript-proofs-vendored-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          lint: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Record vendored proof imports
        id: vendored-inputs
        shell: bash
        run: |
          set -euo pipefail
          proof_dir=PrimalitySheafVerification/ManuscriptAudit
          read -ra proofs <<< "$CORE_PROOFS NodalCotangent CubicTraceInfinitude CuspScheme CuspConductorSquare SkyscraperUniqueRefinements SmallEtaleGeometricBaseChange ClosedRationalPointUniqueRefinements ClosedRationalSkyscraperOffSupport SmallEtaleGeometricSkyscraperPushforward CuspOriginGeometricDirectImage RationalPointStalkConservative NestedOpenRationalOriginQuotient CuspOpenOriginSequence CuspProperCompactification CuspCompactSupportSequence CuspEtaleCommonQuotient CuspFiniteEtaleBases CuspEtaleConductorPatch CuspMilnorCoefficients CuspPatchedFiniteProjective CuspNormalizationRecovery CuspPatchedFiniteEtale CuspFiniteEtaleDescent CuspEtaleDescent CuspEtaleHom CuspAffineEtale CuspAffineEtaleEquivalence CuspSmallEtaleCohomology GeometricCuspBump ArithmeticCuspBump CuspNormalizationConstants ArithmeticCuspNormalization CuspPlaneSmoothness CuspCotangent PadicLogNonzero FiniteFieldPointCount Paper5FixedGeometricTorsion Paper5FixedPositiveGeometricTorsion CubicFiniteTorsion CubicGeometricTorsion CubicGeometricConverse CubicTraceClassification CubicGeometricClassification Spt2BenchmarkLength"
          for proof in "${proofs[@]}"; do
            awk '$1 == "import" && $2 ~ /^Mathlib(\.|$)/ {print $2}' "$proof_dir/$proof.lean"
          done | sort -u > "${RUNNER_TEMP}/manuscript-proof-imports.txt"
          test -s "${RUNNER_TEMP}/manuscript-proof-imports.txt"
          printf 'hash=%s\n' "$(sha256sum "${RUNNER_TEMP}/manuscript-proof-imports.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore compiled modules
        id: compiled
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake
          key: manuscript-lean-imports-0e026509-linux-arm64-${{ steps.vendored-inputs.outputs.hash }}
          restore-keys: manuscript-lean-imports-0e026509-linux-arm64-
      - name: Build the required vendored modules
        id: vendored-dependencies
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t modules < "${RUNNER_TEMP}/manuscript-proof-imports.txt"
          : > "${RUNNER_TEMP}/manuscript-dependencies.log"
          status=0
          lake build "${modules[@]}" > "${RUNNER_TEMP}/manuscript-dependencies.log" 2>&1 || status=$?
          tail -n 60 "${RUNNER_TEMP}/manuscript-dependencies.log"
          exit "$status"
      - name: Keep the compiled modules on GitHub
        continue-on-error: true
        if: steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake
          key: ${{ steps.compiled.outputs.cache-primary-key }}
      - name: Build the original project modules needed by the proofs
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/manuscript-proof-project-imports.log"
          status=0
          lake build PrimalitySheafVerification.Spt2 PrimalitySheafVerification.Spt5 > "$log" 2>&1 || status=$?
          tail -n 60 "$log"
          exit "$status"
      - name: Check the proofs and their transitive axioms
        if: ${{ !cancelled() && steps.vendored-dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          proof_dir=PrimalitySheafVerification/ManuscriptAudit
          compiled="$GITHUB_WORKSPACE/.lake/build/lib/lean"
          mkdir -p "$compiled/$proof_dir"
          audit_lean_path="$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$compiled:$audit_lean_path"
          status=0
          read -ra proofs <<< "$CORE_PROOFS NodalCotangent CubicTraceInfinitude CuspScheme CuspConductorSquare SkyscraperUniqueRefinements SmallEtaleGeometricBaseChange ClosedRationalPointUniqueRefinements ClosedRationalSkyscraperOffSupport SmallEtaleGeometricSkyscraperPushforward CuspOriginGeometricDirectImage RationalPointStalkConservative NestedOpenRationalOriginQuotient CuspOpenOriginSequence CuspProperCompactification CuspCompactSupportSequence CuspEtaleCommonQuotient CuspFiniteEtaleBases CuspEtaleConductorPatch CuspMilnorCoefficients CuspPatchedFiniteProjective CuspNormalizationRecovery CuspPatchedFiniteEtale CuspFiniteEtaleDescent CuspEtaleDescent CuspEtaleHom CuspAffineEtale CuspAffineEtaleEquivalence CuspSmallEtaleCohomology GeometricCuspBump ArithmeticCuspBump CuspNormalizationConstants ArithmeticCuspNormalization CuspPlaneSmoothness CuspCotangent PadicLogNonzero FiniteFieldPointCount Paper5FixedGeometricTorsion Paper5FixedPositiveGeometricTorsion CubicFiniteTorsion CubicGeometricTorsion CubicGeometricConverse CubicTraceClassification CubicGeometricClassification Spt2BenchmarkLength"
          for proof in "${proofs[@]}"; do
            echo "Checking $proof_dir/$proof.lean" | tee -a "${RUNNER_TEMP}/manuscript-proofs.log"
            missing=0
            while IFS= read -r prerequisite; do
              if [[ ! -f "$compiled/$prerequisite.olean" ]]; then
                echo "Missing current build of $prerequisite" | tee -a "${RUNNER_TEMP}/manuscript-proofs.log"
                missing=1
              fi
            done < <(awk '$1 == "import" && $2 ~ /^PrimalitySheafVerification\.ManuscriptAudit\./ {gsub(/[.]/,"/",$2); print $2}' "$proof_dir/$proof.lean")
            if [[ "$missing" == 1 ]]; then
              status=1
              continue
            fi
            if timeout --verbose --kill-after=15s 5m lean --root="$GITHUB_WORKSPACE" \
                -o "$compiled/$proof_dir/$proof.olean" "$GITHUB_WORKSPACE/$proof_dir/$proof.lean" 2>&1 |
                tee -a "${RUNNER_TEMP}/manuscript-proofs.log"; then
              continue
            fi
            rm -f "$compiled/$proof_dir/$proof.olean"
            status=1
          done
          exit "$status"
      - name: Keep the vendored-build logs on GitHub
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manuscript-proofs-vendored-${{ github.sha }}
          path: |
            ${{ runner.temp }}/manuscript-dependencies.log
            ${{ runner.temp }}/manuscript-proof-project-imports.log
            ${{ runner.temp }}/manuscript-proofs.log
          if-no-files-found: warn
          retention-days: 30

  padic:
    name: Vendored Mathlib and p-adic project sources
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 200
    concurrency:
      group: manuscript-padic-vendored-cached-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          lint: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Restore already compiled modules
        id: padic-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake
          key: manuscript-spt1-0e026509-linux-arm64-${{ hashFiles('PrimalitySheafVerification/Spt1.lean') }}
          restore-keys: manuscript-lean-imports-0e026509-linux-arm64-
      - name: Build Spt1, Spt6 and their imports
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/manuscript-spt1-build.log"
          status=0
          lake build PrimalitySheafVerification.Spt1 PrimalitySheafVerification.Spt6 PrimalitySheafVerification.ManuscriptAudit.PadicBinomialLimit > "$log" 2>&1 || status=$?
          tail -n 60 "$log"
          exit "$status"
      - name: Cache compiled Spt1 on GitHub
        continue-on-error: true
        if: steps.padic-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake
          key: ${{ steps.padic-cache.outputs.cache-primary-key }}
      - name: Check the actual logarithm series proof
        shell: bash
        run: |
          set -euo pipefail
          status=0
          proof_dir=PrimalitySheafVerification/ManuscriptAudit
          compiled="$GITHUB_WORKSPACE/.lake/build/lib/lean"
          mkdir -p "$compiled/$proof_dir"
          audit_lean_path="$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$compiled:$audit_lean_path"
          for proof in PadicLogNonzero PadicRemainder PadicCertificates PadicLipschitz PadicExactBridge PadicCoefficientTransfer PadicSpt6Bridge; do
            lean --root="$GITHUB_WORKSPACE" -o "$compiled/$proof_dir/$proof.olean" \
              "$GITHUB_WORKSPACE/$proof_dir/$proof.lean" 2>&1 |
                tee -a "${RUNNER_TEMP}/manuscript-spt1-proof.log" || status=1
          done
          exit "$status"
      - name: Keep the Spt1 check logs on GitHub
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manuscript-padic-vendored-${{ github.sha }}
          path: |
            ${{ runner.temp }}/manuscript-spt1-build.log
            ${{ runner.temp }}/manuscript-spt1-proof.log
          if-no-files-found: warn
          retention-days: 30

  upstream:
    name: Upstream Mathlib compatibility
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    concurrency:
      group: manuscript-proofs-upstream-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: 79d0395a1825a6264ad5d269e35e60537518955e
          path: upstream-mathlib
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          lint: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
          lake-package-directory: upstream-mathlib
      - name: Retrieve the upstream module cache
        shell: bash
        working-directory: upstream-mathlib
        run: |
          set -euo pipefail
          proof_dir=../PrimalitySheafVerification/ManuscriptAudit
          read -ra proofs <<< "$CORE_PROOFS CubicTraceInfinitude CuspScheme CuspConductorSquare SkyscraperUniqueRefinements SmallEtaleGeometricBaseChange ClosedRationalPointUniqueRefinements ClosedRationalSkyscraperOffSupport SmallEtaleGeometricSkyscraperPushforward CuspOriginGeometricDirectImage RationalPointStalkConservative NestedOpenRationalOriginQuotient CuspOpenOriginSequence CuspProperCompactification CuspCompactSupportSequence CuspEtaleCommonQuotient CuspFiniteEtaleBases CuspEtaleConductorPatch CuspMilnorCoefficients CuspPatchedFiniteProjective CuspNormalizationRecovery CuspPatchedFiniteEtale CuspFiniteEtaleDescent CuspEtaleDescent CuspEtaleHom CuspAffineEtale CuspAffineEtaleEquivalence CuspSmallEtaleCohomology GeometricCuspBump ArithmeticCuspBump CuspNormalizationConstants ArithmeticCuspNormalization CuspPlaneSmoothness PadicLogNonzero FiniteFieldPointCount Paper5FixedGeometricTorsion Paper5FixedPositiveGeometricTorsion CubicFiniteTorsion CubicGeometricTorsion CubicGeometricConverse CubicTraceClassification CubicGeometricClassification"
          mapfile -t modules < <(
            for proof in "${proofs[@]}"; do
              awk '$1 == "import" && $2 ~ /^Mathlib(\.|$)/ {print $2}' "$proof_dir/$proof.lean"
            done | sort -u
          )
          test "${#modules[@]}" -gt 0
          log="${RUNNER_TEMP}/manuscript-upstream-dependencies.log"
          if ! lake exe cache get "${modules[@]}" 2>&1 | tee "$log"; then
            echo "Upstream cache was unavailable. Building required modules." | tee -a "$log"
          fi
          lake build "${modules[@]}" 2>&1 | tee -a "$log"
      - name: Restore checked Lean proof files
        id: upstream-checked-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/manuscript-proof-modules
          key: manuscript-upstream-checked-linux-arm64-79d0395a-v1-${{ github.sha }}
          restore-keys: manuscript-upstream-checked-linux-arm64-79d0395a-v1-
      - name: Check the proofs with upstream Mathlib
        id: upstream-check
        shell: bash
        working-directory: upstream-mathlib
        run: |
          set -euo pipefail
          status=0
          compiled="${RUNNER_TEMP}/manuscript-proof-modules"
          package_path="PrimalitySheafVerification/ManuscriptAudit"
          records="$compiled/checks"
          output="${RUNNER_TEMP}/manuscript-proofs-upstream.log"
          mkdir -p "$compiled/$package_path" "$records"
          : > "$output"
          audit_lean_path="$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$compiled:$audit_lean_path"
          read -ra proofs <<< "$CORE_PROOFS CubicTraceInfinitude CuspScheme CuspConductorSquare SkyscraperUniqueRefinements SmallEtaleGeometricBaseChange ClosedRationalPointUniqueRefinements ClosedRationalSkyscraperOffSupport SmallEtaleGeometricSkyscraperPushforward CuspOriginGeometricDirectImage RationalPointStalkConservative NestedOpenRationalOriginQuotient CuspOpenOriginSequence CuspProperCompactification CuspCompactSupportSequence CuspEtaleCommonQuotient CuspFiniteEtaleBases CuspEtaleConductorPatch CuspMilnorCoefficients CuspPatchedFiniteProjective CuspNormalizationRecovery CuspPatchedFiniteEtale CuspFiniteEtaleDescent CuspEtaleDescent CuspEtaleHom CuspAffineEtale CuspAffineEtaleEquivalence CuspSmallEtaleCohomology GeometricCuspBump ArithmeticCuspBump CuspNormalizationConstants ArithmeticCuspNormalization CuspPlaneSmoothness PadicLogNonzero FiniteFieldPointCount Paper5FixedGeometricTorsion Paper5FixedPositiveGeometricTorsion CubicFiniteTorsion CubicGeometricTorsion CubicGeometricConverse CubicTraceClassification CubicGeometricClassification"
          for proof in "${proofs[@]}"; do
            source="$GITHUB_WORKSPACE/$package_path/$proof.lean"
            stamp="$records/$proof.sha256"
            proof_log="$records/$proof.log"
            object="$compiled/$package_path/$proof.olean"
            echo "Checking $package_path/$proof.lean" | tee -a "$output"
            deps=()
            missing=0
            while IFS= read -r prerequisite; do
              if [[ ! -s "$records/$prerequisite.sha256" ||
                    ! -f "$compiled/$package_path/$prerequisite.olean" ]]; then
                echo "Missing checked import $prerequisite" | tee -a "$output"
                missing=1
              else
                deps+=("$records/$prerequisite.sha256")
              fi
            done < <(awk '$1 == "import" && $2 ~ /^PrimalitySheafVerification\.ManuscriptAudit\./ {sub(/^.*\./,"",$2); print $2}' "$source")
            if [[ "$missing" == 1 ]]; then
              status=1
              rm -f "$object" "$stamp" "$proof_log"
              continue
            fi
            fingerprint="$({
              sha256sum < "$source"
              for dep in "${deps[@]}"; do cat "$dep"; done
            } | sha256sum | cut -d ' ' -f 1)"
            if [[ -f "$object" && -f "$proof_log" && -f "$stamp" &&
                  "$(cat "$stamp")" == "$fingerprint" ]]; then
              echo "Reused checked source and imports: $fingerprint" | tee -a "$output"
              cat "$proof_log" | tee -a "$output"
              continue
            fi
            rm -f "$object" "$stamp" "$proof_log"
            if timeout --verbose --kill-after=15s 5m lean --root="$GITHUB_WORKSPACE" -o "$object" "$source" 2>&1 |
                tee "$proof_log" | tee -a "$output"; then
              printf '%s\n' "$fingerprint" > "$stamp"
            else
              status=1
              rm -f "$object" "$stamp" "$proof_log"
            fi
          done
          exit "$status"
      - name: Keep checked Lean proof files on GitHub
        if: ${{ !cancelled() && steps.upstream-check.outcome != 'skipped' && steps.upstream-checked-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/manuscript-proof-modules
          key: ${{ steps.upstream-checked-cache.outputs.cache-primary-key }}
      - name: Keep the upstream compatibility log on GitHub
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manuscript-proofs-upstream-${{ github.sha }}
          path: |
            ${{ runner.temp }}/manuscript-upstream-dependencies.log
            ${{ runner.temp }}/manuscript-proofs-upstream.log
          if-no-files-found: warn
          retention-days: 30
