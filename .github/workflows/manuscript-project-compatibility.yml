name: Manuscript project-dependent proof compatibility
on:
  push:
    branches: [codex/overleaf-bundle-formalization]
    paths:
      - '.github/workflows/manuscript-project-compatibility.yml'
      - 'PrimalitySheafVerification/ManuscriptAudit/PadicRemainder.lean'
      - 'PrimalitySheafVerification/ManuscriptAudit/PadicCertificates.lean'
      - 'PrimalitySheafVerification/ManuscriptAudit/PadicLipschitz.lean'
      - 'PrimalitySheafVerification/ManuscriptAudit/PadicBinomialLimit.lean'
      - 'PrimalitySheafVerification/ManuscriptAudit/PadicExactBridge.lean'
      - 'PrimalitySheafVerification/ManuscriptAudit/PadicLogNonzero.lean'
      - 'PrimalitySheafVerification/ManuscriptAudit/PadicCoefficientTransfer.lean'
      - 'PrimalitySheafVerification/ManuscriptAudit/PadicSpt6Bridge.lean'
      - 'PrimalitySheafVerification/ManuscriptAudit/NodalCotangent.lean'
      - 'PrimalitySheafVerification/ManuscriptAudit/CuspCotangent.lean'
      - 'PrimalitySheafVerification/ManuscriptAudit/CuspPlaneSmoothness.lean'
      - 'PrimalitySheafVerification/ManuscriptAudit/CuspDelta.lean'
      - 'PrimalitySheafVerification/Spt1.lean'
      - 'PrimalitySheafVerification/Spt5.lean'
      - 'PrimalitySheafVerification/Spt6.lean'
      - 'PrimalitySheafVerification/Verification.lean'
      - 'lean-toolchain'
permissions:
  contents: read
concurrency:
  group: manuscript-project-upstream-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: Spt1, Spt5, and Spt6 against official Mathlib
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: 79d0395a1825a6264ad5d269e35e60537518955e
          path: upstream-mathlib
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          lint: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
          lake-package-directory: upstream-mathlib
      - name: Retrieve precompiled official Mathlib
        shell: bash
        working-directory: upstream-mathlib
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/manuscript-project-upstream"
          lake exe cache get Mathlib 2>&1 |
            tee "${RUNNER_TEMP}/manuscript-project-upstream/mathlib-cache.log"
          lake build Mathlib 2>&1 |
            tee "${RUNNER_TEMP}/manuscript-project-upstream/mathlib-build.log"
      - name: Check the existing project imports and new theorems
        shell: bash
        working-directory: upstream-mathlib
        run: |
          set -euo pipefail
          logs="${RUNNER_TEMP}/manuscript-project-upstream"
          compiled="${RUNNER_TEMP}/manuscript-project-modules"
          project=PrimalitySheafVerification
          mkdir -p "$compiled/$project/ManuscriptAudit"
          audit_lean_path="$(lake env printenv LEAN_PATH)"
          status=0
          if lake env lean --root="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/$project/Verification.lean" \
              > "$logs/Verification.log" 2>&1; then
            echo "Verification.lean passed"
          else
            tail -n 80 "$logs/Verification.log"
            status=1
          fi
          for source in Spt1 Spt5 Spt6; do
            if [[ "$source" == Spt1 ]]; then
              proofs=(PadicRemainder PadicCertificates PadicLipschitz)
            elif [[ "$source" == Spt5 ]]; then
              proofs=(NodalCotangent)
            else
              proofs=(PadicSpt6Bridge)
            fi
            if lake env lean --root="$GITHUB_WORKSPACE" -o "$compiled/$project/$source.olean" \
                "$GITHUB_WORKSPACE/$project/$source.lean" > "$logs/$source.log" 2>&1; then
              if [[ "$source" == Spt1 ]]; then
                if lake env lean --root="$GITHUB_WORKSPACE" \
                    -o "$compiled/$project/ManuscriptAudit/PadicBinomialLimit.olean" \
                    "$GITHUB_WORKSPACE/$project/ManuscriptAudit/PadicBinomialLimit.lean" \
                    > "$logs/PadicBinomialLimit.log" 2>&1; then
                  proofs+=(PadicExactBridge PadicLogNonzero PadicCoefficientTransfer)
                else
                  tail -n 80 "$logs/PadicBinomialLimit.log"
                  status=1
                fi
              elif [[ "$source" == Spt5 ]]; then
                if lake env lean --root="$GITHUB_WORKSPACE" \
                    -o "$compiled/$project/ManuscriptAudit/CuspDelta.olean" \
                    "$GITHUB_WORKSPACE/$project/ManuscriptAudit/CuspDelta.lean" \
                    > "$logs/CuspDelta.log" 2>&1 &&
                    LEAN_PATH="$compiled:$audit_lean_path" lean --root="$GITHUB_WORKSPACE" \
                      -o "$compiled/$project/ManuscriptAudit/CuspPlaneSmoothness.olean" \
                      "$GITHUB_WORKSPACE/$project/ManuscriptAudit/CuspPlaneSmoothness.lean" \
                      > "$logs/CuspPlaneSmoothness.log" 2>&1; then
                  proofs+=(CuspCotangent)
                else
                  for log in "$logs/CuspDelta.log" "$logs/CuspPlaneSmoothness.log"; do
                    if [[ -f "$log" ]]; then tail -n 80 "$log"; fi
                  done
                  status=1
                fi
              fi
              for proof in "${proofs[@]}"; do
                LEAN_PATH="$compiled:$audit_lean_path" \
                  lean --root="$GITHUB_WORKSPACE" -o "$compiled/$project/ManuscriptAudit/$proof.olean" \
                    "$GITHUB_WORKSPACE/$project/ManuscriptAudit/$proof.lean" 2>&1 |
                  tee "$logs/$proof.log" || status=1
              done
            else
              tail -n 80 "$logs/$source.log"
              status=1
            fi
          done
          exit "$status"
      - name: Preserve the project compatibility logs on GitHub
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manuscript-project-upstream-${{ github.sha }}
          path: ${{ runner.temp }}/manuscript-project-upstream
          if-no-files-found: warn
          retention-days: 30
